# Full-context test profile. The DB (R2DBC for the app + JDBC for Liquibase) is a
# REAL Postgres container wired by Testcontainers in the shared
# systems.hugmesh.commons.testsupport.PostgresTestSupport base — a REAL Postgres
# is REQUIRED here (jsonb + the partial unique index + gen_random_uuid are Postgres
# features the H2 compat mode cannot honour; the @DataR2dbcTest slice uses the
# PostgresSliceTestConfig over the same container, the forum-bff 004 pattern). The
# base's DynamicPropertySource supplies the r2dbc URL + the Liquibase JDBC URL
# pointed at the SAME per-class database, so Liquibase migrates the schema the
# repositories then read.
#
# spring.r2dbc.url / spring.liquibase.url are deliberately ABSENT (the base supplies
# them). Under Spring Boot 4 the two production autoconfigs MUST stay ENABLED so the
# base's URLs are honoured. The context-load test runs a JWT-decoder mock so no live
# Casdoor is needed.
spring:
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"

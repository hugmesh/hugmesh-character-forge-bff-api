# ─────────────────────────────────────────────────────────────────────────────
# GitHub-side COMPILE + TEST GATE (the org exemplar rolled out from forum-bff).
#
# WHY THIS EXISTS
# Merges happen on GitHub (`gh pr merge`), but the existing test pipeline runs on the
# in-cluster GitLab mirror (.gitlab-ci.yml) — and GitHub never waits for GitLab. So a
# PR could merge with a BROKEN main and GitLab only fail afterwards. This workflow
# makes the compile + test a REQUIRED, merge-blocking GitHub status check.
#
# RUNNER — github-hosted `ubuntu-latest`.
# Both jobs used to ask for `runs-on: [self-hosted, hugmesh-x86]`. No runner carries
# that label (the org's self-hosted runner has self-hosted, Linux, X64), so every run
# since the file was added ended `cancelled` after GitHub's 24h queue limit: this gate
# has never reported. It now runs on `ubuntu-latest`, which has Docker (Testcontainers)
# and Chrome (karma). Plain `ubuntu-latest`, not the RUNS_ON repository variable.
#
# KNOWN FAILURE UNTIL THE MAVEN CHAIN MOVES: the `build` job still resolves the
# private hugmesh-parent / hugmesh-commons from the in-cluster GitLab group Maven
# registry through the GITLAB_* secrets, which a github-hosted runner cannot reach
# (tailnet-only). So `build (Spring BFF)` fails at dependency resolution until the
# build reads the chain from GitHub Packages. That is a separate change from the label.
#
# SCOPE — ALL THREE LANES OF THIS REPO ARE GATED HERE.
# This repo ships three suites in one tree (DESIGN §4): the Spring BFF at the root, the
# Angular remote under frontend/, and the Godot maker under godot/. The workflow used to
# claim the latter two "ship their own pipelines" and skip them — they do not: there is no
# other pipeline in this repo or anywhere else that runs `ng test` or
# `godot -s res://tests/run_tests.gd` for this code. The result was that ~64 karma specs
# and ~254 Godot assertions were never executed by any gate, which is exactly how the
# save-path break (the client mirror emitting values the BFF answers 400 on) and a Godot
# project that did not even PARSE both reached main.
#
# PREREQS (one-time, per the org / repo settings):
#   1. (none: the runner is github-hosted `ubuntu-latest`)
#   2. Add repo/org SECRETS that map to the settings.xml ${env.*} placeholders:
#        GITLAB_MAVEN_TOKEN  -> a read-scoped token for the GitLab group Maven registry
#        GITLAB_API_V4_URL   -> the in-cluster GitLab API v4 URL
#        GITLAB_GROUP_ID     -> the HugMesh GitLab group id
#   3. Install the two extra lane toolchains ON THE RUNNER (both jobs below fail LOUDLY
#      with the exact reason when they are missing — never silently skip):
#        * a Chrome/Chromium binary for headless karma (`chromium` or `google-chrome`);
#          the `frontend` job auto-detects it, or set the CHROME_BIN repo variable.
#        * the official Godot 4.7-stable linux editor binary for the headless GDScript
#          suite; put it on PATH as `godot` or set the GODOT_BIN repo variable.
#          (Export TEMPLATES are NOT needed — `make -C godot test` never exports.)
#   4. Branch protection on `main`: require "build" and "frontend" to pass. The former
#      "godot" job left with the Godot project — its suite now runs in hugmesh-games.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run when a PR is updated, so the gate always reflects the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Spring BFF)
    # Github-hosted (the hugmesh-x86 label is retired) — see the RUNNER note above. Has Docker for Testcontainers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (matches the GitLab CI eclipse-temurin:25 image)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `mvnw verify` compiles main + test sources AND runs the suite. `verify` also
      # runs the Testcontainers full-context tests against the host Docker daemon (Ryuk
      # disabled — the runner reaps its own short-lived containers, matching .gitlab-ci.yml).
      # settings.xml resolves the private hugmesh-parent/commons from the GitLab group
      # Maven registry via the secrets mapped to its ${env.*} placeholders (NO secret in git).
      #
      # NOTE this also runs ClientContractFixturesTest, the SERVER half of the shared
      # cross-language contract (frontend/src/app/character-forge/contract/
      # server-contract.fixtures.json). Its client half lives in the `frontend` job below —
      # the pair is only meaningful when BOTH run, which is the point of gating all three.
      - name: Build + test (merge gate)
        env:
          CI_JOB_TOKEN: ${{ secrets.GITLAB_MAVEN_TOKEN }}
          CI_API_V4_URL: ${{ secrets.GITLAB_API_V4_URL }}
          GITLAB_GROUP_ID: ${{ secrets.GITLAB_GROUP_ID }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          MAVEN_OPTS: "-Dapi.version=1.43"
        run: ./mvnw -B -s settings.xml clean verify

  frontend:
    name: frontend (Angular remote — karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24 (matches the frontend Dockerfile builder stage)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      # karma.conf.js resolves CHROME_BIN itself (env → the usual chromium/chrome paths)
      # and ABORTS with an explicit message when none is found. It must never quietly
      # report success without a browser.
      - name: Unit tests (ng test / karma, headless)
        env:
          CHROME_BIN: ${{ vars.CHROME_BIN }}
        run: npm test

      # A remote that does not BUILD is not shippable, and the type-level half of the
      # mirror contract (the `as const` vocabularies, the Char3dConfig shape) only gets
      # checked by a real compile.
      - name: Production build
        run: npm run build

      # CATALOGUE PARITY IS NOT CHECKED HERE ANY MORE (removed 2026-10-07).
      # The step ran `node tools/asset-pipeline/build-lanes.mjs --check`, which reads the
      # ENGINE copy of the catalogue (godot/character-forge/assets/packs/lanes.json and
      # scripts/char3d_config.gd). Those files moved to hugmesh-games
      # (games/character-forge/) with the Godot project (b232d38), so the script dies
      # with ENOENT on a clean checkout: the first hosted run showed it (run 37691430952,
      # job 113032297809). It had never executed before, because this workflow never got a
      # runner. Nothing replaces it: hugmesh-games has no build-lanes. Restoring the gate
      # needs the two repos side by side (a cross-repo checkout of the private
      # hugmesh-games needs a token this repo does not have) or the check moving to
      # hugmesh-games. This is an open gap, stated in PR #28, not a silent drop.

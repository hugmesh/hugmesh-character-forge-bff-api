name: Release

# Builds the image and pushes it to GHCR (ghcr.io/hugmesh/hugmesh-character-forge-bff-api).
#
# WHAT PUBLISHES WHAT (beta scheme, 2026-10-21)
#   push to main                      -> :main and :sha-<12>. No versioned tag moves.
#   push of tag v<version>            -> :<version>, :beta and :sha-<12>, then a GitHub prerelease.
#   workflow_dispatch on a v* tag     -> the same as the tag push (the re-run path).
#   workflow_dispatch on main         -> the same as a push to main.
#   anything else                     -> refused by the version job, nothing is built.
# The tag is the publish decision: <version> is the project <version> in pom.xml (and
# frontend/package.json), and scripts/release-version.sh refuses a tag that does not name it.
# A published <version> tag is never overwritten, and a beta never moves :latest.
#
# RUNNER. Every job uses the same runs-on expression. It picks the runner list in the
# RUNS_ON_PUBLISH repository variable (a JSON array such as ["self-hosted","Linux","X64"]) ONLY
# for a non-pull-request event on refs/heads/main or a v*/studio-v* tag; everything else, and
# every run while RUNS_ON_PUBLISH is unset, goes to GitHub-hosted ubuntu-latest. Deleting
# RUNS_ON_PUBLISH is the off switch. This workflow has no pull_request trigger and must never get
# one. The expression keeps our own jobs off the local runner; it is NOT a security boundary
# against fork pull requests, which bring their own workflow file (that protection is the runner
# group's settings).
#
# The Maven build inside the Dockerfile resolves the PRIVATE net.hugmesh libraries
# (hugmesh-parent, hugmesh-build-config, hugmesh-commons) from GitHub
# Packages through .github/maven-ci-settings.xml, selected by the BuildKit secret
# `packages_read_token` (see the Dockerfile). They are published by the release chain; until it
# has run, the Preflight step fails by name. The repo-root settings.xml (GitLab registry) is not
# used by this workflow and stays for GitLab CI and the local compose lane.
#
# Shape copied from hugmesh-tube-bff-api's release.yml (itself from hugmesh-user-bff-api, reconciled
# with owncast-bff), with hugmesh-auth-core NOT in the preflight (this service does not depend on it)
# and the build-record upload switched off. Only the image name differs.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hugmesh/hugmesh-character-forge-bff-api

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
      sha12: ${{ steps.guard.outputs.sha12 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Refuses any ref other than main or v<pom version>, a SNAPSHOT, a malformed version and a
      # frontend/package.json that disagrees with the pom. Nothing below runs when it fails.
      - name: Version guard
        id: guard
        run: bash scripts/release-version.sh

  preflight:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      # Preflight, cross-repo package read. Fails here, by name, instead of deep inside Maven.
      # The net.hugmesh libraries live in the PRIVATE GitHub Packages registries of the chain
      # repositories. The automatic GITHUB_TOKEN cannot read another repository's package, so
      # this job needs the PACKAGES_READ_TOKEN secret (a classic PAT with read:packages,
      # decision 90a = B in hugmesh-commons/RELEASING.md). There is deliberately NO fall-back to
      # GITHUB_TOKEN: it cannot work, and an unset secret would otherwise select the dead
      # GitLab settings.xml and fail as "Non-resolvable parent POM ... /groups//".
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            echo "::error::secret PACKAGES_READ_TOKEN is not set for this repository. Set it as a REPOSITORY secret under Settings -> Secrets and variables -> Actions (the org is on the Free plan, where an org secret does not reach private repositories): a classic personal access token with the read:packages scope. The automatic GITHUB_TOKEN cannot read another repository's packages, so there is no fall-back."
            exit 1
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': PACKAGES_READ_TOKEN cannot read that repository's Maven registry. It must be a classic PAT with read:packages, not expired, from an account that can read the repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (run the release chain: build-config, parent, commons), or (b) it is published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified, do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

  build-and-push:
    needs: [version, preflight]
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published <version> tag is immutable: a release run stops if it already exists. Only a
      # clear "not found" lets the run go on; any other registry error stops it too, because
      # "could not look" must not be read as "absent".
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          if out=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1); then
            echo "::error::${IMAGE}:${VERSION} is already published. A beta is never overwritten: raise N in pom.xml and frontend/package.json, merge, and tag the new version."
            exit 1
          fi
          if printf '%s\n' "${out}" | grep -a -i -E 'not found|manifest unknown|name unknown' >/dev/null; then
            echo "${IMAGE}:${VERSION} is not published yet."
          else
            printf '%s\n' "${out}"
            echo "::error::could not tell whether ${IMAGE}:${VERSION} exists (the registry answered with something other than 'not found'). Nothing was pushed."
            exit 1
          fi

      # Release: <version> (immutable), beta (newest beta of this repo), sha-<12>.
      # Main: main, sha-<12>. Never latest: it is reserved for a final (non-beta) release, and
      # none exists yet, so a final version is refused here until that decision is made.
      - name: Compute image tags
        id: tags
        env:
          KIND: ${{ needs.version.outputs.kind }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA12: ${{ needs.version.outputs.sha12 }}
        run: |
          set -euo pipefail
          case "${KIND}" in
            release)
              case "${VERSION}" in
                *-beta.*) ;;
                *) echo "::error::${VERSION} is not a beta; a final release needs its own decision about moving tags."; exit 1 ;;
              esac
              tags="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:beta"$'\n'"${IMAGE}:sha-${SHA12}"
              label_version="${VERSION}"
              ;;
            main)
              tags="${IMAGE}:main"$'\n'"${IMAGE}:sha-${SHA12}"
              label_version=main
              ;;
            *)
              echo "::error::unknown kind '${KIND}'"
              exit 1
              ;;
          esac
          {
            echo "tags<<EOF_TAGS"
            echo "${tags}"
            echo "EOF_TAGS"
            echo "label_version=${label_version}"
          } >> "$GITHUB_OUTPUT"
          echo "${tags}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          # build-push-action v6 uploads a build-record artifact holding the raw BuildKit logs,
          # which runner-side secret masking does not cover. Off, so a token can never reach an
          # artifact.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.label_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

  github-release:
    needs: [version, build-and-push]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      # A prerelease, never "latest". A dispatch that re-runs an existing release leaves it alone.
      - name: Create the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA12: ${{ needs.version.outputs.sha12 }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; left unchanged"
            exit 0
          fi
          prerelease=()
          case "${VERSION}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${TAG}" --verify-tag "${prerelease[@]}" --latest=false \
            --title "${TAG}" \
            --notes "Image: ${IMAGE}:${VERSION} (also :beta and :sha-${SHA12})."

# nginx-unprivileged serves the character-forge remote on :8080.
# remoteEntry.json + the federated chunks must be reachable by the host shell;
# everything else falls back to index.html (SPA) so the dev-shell route resolves.
# Cloned from hugmesh-character-studio-ui/nginx.conf with one addition: the
# Godot web-export MIME types (.wasm/.pck under assets/game/). COOP/COEP are
# deliberately NOT set — the web export runs threads OFF (single-threaded,
# DESIGN §0) so no cross-origin isolation is needed.
#
# Per-response CSP nonce source. nginx has no random function, so we reuse
# $request_id (a fresh 32-hex token per request): unguessable and different every
# response, which is exactly what a nonce must be. The `map` exposes it as
# $cspnonce so the sub_filter rewrite and the CSP header below reference the SAME
# value for a given response.
#
# Scope note: the Dockerfile installs this file as
# `COPY nginx.conf /etc/nginx/conf.d/default.conf`, and the stock
# nginx-unprivileged /etc/nginx/nginx.conf does `include /etc/nginx/conf.d/*.conf;`
# from INSIDE the http block — so this file is http-scope and a bare `map` here is
# legal (it must NOT be wrapped in an http { } block).
#
# WHY THIS EXISTS: the Angular native-federation build emits an INLINE
# `<script type="esms-options">` in index.html and loads main via
# `type="module-shim"`. The gateway sends a fallback CSP of `script-src 'self'`
# to any UI that does not send its own, which blocks that inline script — so
# es-module-shims is never configured, the module-shim bundle never runs, Angular
# never bootstraps, and the page renders BLANK with no server error. The nonce
# below is what makes the inline script legal again.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot engine bundle: .wasm must be served as application/wasm for
    # WebAssembly streaming compilation. `types` here is scoped to this
    # location only (nothing but .wasm matches), so the inherited MIME map
    # for every other file stays intact.
    # Runtime theme (fleet 50-hug-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's HUG_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    #
    # LEGACY PATH, KEPT DELIBERATELY (RENAME PHASE 3). /hug-theme.css below is
    # now the canonical name and this image's index.html asks for that one. This
    # block stays for the two readers that can still ask for the old name: an
    # index.html baked into an image built before this commit, and a browser
    # replaying a cached document. The hook writes BOTH files byte-for-byte, so
    # the two URLs are the same bytes and neither can 404.
    #
    # RETIRE WHEN: every image in the fleet has been rebuilt from a tree
    # containing this commit AND no cached document can still reference the old
    # name. The stylesheet itself is served no-store, so it is the *documents*
    # that pin it, not the stylesheet — one release cycle (~30 days) is a
    # comfortable window. Deleting this block early costs a silently unthemed
    # page, which is the exact failure this whole migration is sequenced to
    # avoid, so err long.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CANONICAL PATH (RENAME PHASE 3). index.html <link>s this name, and
    # docker-entrypoint.d/50-hug-theme.sh writes it as its PRIMARY output.
    # Directives mirror the legacy block above exactly — same no-store, same
    # re-emitted security headers — because the two URLs really are the same
    # bytes under two names, and a reader must not be able to tell which one
    # they asked for from anything except the path.
    location = /hug-theme.css {
        alias /tmp/hug-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Godot main pack — an opaque binary blob.
    location ~* \.pck$ {
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hashed immutable bundles — long cache.
    location ~* \.(js|css|woff2?|png|svg|webp|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # remoteEntry.json must always be fresh (it maps the exposed modules).
    location = /remoteEntry.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off       : index.html has several <script> tags.
        #   - sub_filter_types text/html: ONLY rewrite HTML; the JS/CSS/wasm/pck
        #                                 payloads are left byte-for-byte untouched.
        # es-module-shims (2.x) auto-propagates the nonce to the module scripts it
        # injects, so native federation keeps working under a nonce-only policy.
        # Do NOT enable gzip_static / precompressed index.html here — sub_filter
        # cannot rewrite an already-compressed body, which would silently
        # reintroduce the blank-page bug this config exists to fix.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # script-src carries the nonce and NO 'unsafe-inline' (which browsers
        # ignore anyway once a nonce is present). 'wasm-unsafe-eval' is REQUIRED
        # here and NOT in character-studio: this remote runs the Godot web export,
        # and without it WebAssembly.instantiate is blocked outright by
        # script-src. style-src DOES need 'unsafe-inline' — Angular writes
        # component styles inline at runtime and they cannot be nonced.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
